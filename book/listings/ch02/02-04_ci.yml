# SPDX-License-Identifier: Apache-2.0
# CI: tools/check.sh inside the open-source tools image built from
# tools/Dockerfile, on every push and pull request, weekly and on
# demand. The image is cached between runs and never published.
# Vivado is not in CI: it is installed natively (Chapter 2).
name: ci
on:
  push:
    branches: [main]
    tags: ["v*", "ch*-*"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the tools image (tools/Dockerfile)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/Dockerfile
          tags: loom-oss:ci
          load: true
          push: false
          cache-from: type=gha,scope=loom-oss
          cache-to: type=gha,mode=max,scope=loom-oss

      - name: Lint, listings, simulation and cocotb tests
        run: >
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/work" -w /work loom-oss:ci tools/check.sh
